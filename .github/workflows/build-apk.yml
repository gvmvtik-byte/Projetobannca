name: Gerar APK

on:
  push:
    branches: [ main, principal ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar projeto
        run: |
          unzip -o "ProjetoBanca_0_4_7_corrigido(3).zip" -d extracted_files

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          accept-android-sdk-licenses: false
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Aceitar licencas Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Corrigir codigo e Compilar APK
        run: |
          PROJECT_DIR=$(find extracted_files -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)
          echo "Pasta do projeto encontrada: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Corrige automaticamente os erros de Smart Cast no DatabaseBackup.kt
          BACKUP_FILE="app/src/main/java/br/com/banca/app/DatabaseBackup.kt"
          if [ -f "$BACKUP_FILE" ]; then
            sed -i 's/\.endedAtEpochMillis\b/.endedAtEpochMillis!!/g' "$BACKUP_FILE"
            sed -i 's/\.observedShare\b/.observedShare!!/g' "$BACKUP_FILE"
            sed -i 's/!!!!/!!/g' "$BACKUP_FILE"
          fi
          
          # Compila mantendo a flag que resolve o conflito Java 1.8 vs Kotlin 17
          gradle assembleDebug -Pkotlin.jvm.target.validation.mode=ignore

      - name: Salvar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ProjetoBanca-APK
          path: extracted_files/**/app/build/outputs/apk/debug/app-debug.apk
