name: Gerar APK

on:
  push:
    branches: [ main, principal ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar projeto
        run: |
          unzip -o "ProjetoBanca_0_4_7_corrigido(3).zip" -d temp_folder
          # Move tudo de dentro da pasta extraída para a raiz principal
          cp -r temp_folder/ProjetoBanca/* .
          cp -r temp_folder/ProjetoBanca/.* . 2>/dev/null || true

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          accept-android-sdk-licenses: false
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Aceitar licencas Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Dar permissao e Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ProjetoBanca-APK
          path: app/build/outputs/apk/debug/app-debug.apk
