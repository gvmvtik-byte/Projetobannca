name: Android CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ADICIONE ESTA ETAPA ANTES DE CHAMAR O SDKMANAGER:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Agora esta etapa vai funcionar sem o erro de "command not found"
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses
