name: Gerar APK

on:
  push:
    branches: [ main, principal ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar projeto
        run: |
          unzip -o "ProjetoBanca_0_4_7_corrigido(3).zip" -d extracted_files

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          accept-android-sdk-licenses: false
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Aceitar licencas Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Compilar APK com Gradle do sistema
        run: |
          PROJECT_DIR=$(find extracted_files -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)
          echo "Pasta do projeto encontrada: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Compila o APK ignorando os erros de smart-cast do Kotlin
          gradle assembleDebug -Pkotlin.options.suppressWarnings=true

      - name: Salvar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ProjetoBanca-APK
          path: extracted_files/**/app/build/outputs/apk/debug/app-debug.apk
